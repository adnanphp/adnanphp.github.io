<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Projects | Muhammad Adnan Shahzad</title>
  <meta name="description" content="Research and engineering projects in ML, DL, CV, LLMs, MLOps, Data Engineering and BI.">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header>
    <h1>Projects</h1>
    <p>Research and engineering — ML · DL · CV · LLMs · MLOps · Data · BI</p>
  </header>

  <nav>
    <a href="/">Home</a>
    <a href="/pages/about.html">About</a>
    <a href="/pages/publications.html">Publications</a>
    <a href="https://github.com/adnanphp" target="_blank">GitHub</a>
    <a href="https://www.linkedin.com/in/adnanphy/" target="_blank">LinkedIn</a>
  </nav>

  <main>
    <section>
      <h2>Featured</h2>
      <ul class="repo-grid" id="featured-grid"></ul>
    </section>

    <section>
      <h2>Browse by Area</h2>
      <div id="groups"></div>
    </section>

    <section>
      <h2>Other repositories</h2>
      <ul class="repo-grid" id="other-grid"></ul>
    </section>
  </main>

  <footer>
    <p>&copy; Adnan —
      <a href="https://twitter.com/MAShahzad16" target="_blank">Twitter</a> ·
      <a href="https://www.linkedin.com/in/adnanphy/" target="_blank">LinkedIn</a> ·
      <a href="https://github.com/adnanphp" target="_blank">GitHub</a>
    </p>
  </footer>

  <script>
  async function load() {
    const [repos, cats] = await Promise.all([
      fetch('/data/repos.json').then(r => r.json()),
      fetch('/data/categories.json').then(r => r.json()),
    ]);

    const byName = Object.fromEntries(repos.map(r => [r.name, r]));

    function repoCard(r) {
      const lang = r.language ? `<span class="repo-lang">${r.language}</span>` : "";
      const stars = r.stargazers_count ? `<span class="repo-stars">★ ${r.stargazers_count}</span>` : "";
      const topics = (r.topics || []).slice(0, 4)
        .map(t => `<span class="tag">${t}</span>`).join("");
      const desc = r.description ? escapeHtml(r.description) : "<em>No description.</em>";
      return `
        <li class="repo-card">
          <h3><a href="${r.html_url}" target="_blank" rel="noopener">${r.name}</a></h3>
          <p class="repo-desc">${desc}</p>
          <p class="repo-meta">${lang}${stars}</p>
          ${topics ? `<p class="repo-topics">${topics}</p>` : ""}
          <p class="pub-links">
            <a href="${r.html_url}" target="_blank">Code</a>
            ${r.homepage ? `<a href="${r.homepage}" target="_blank">Live</a>` : ""}
          </p>
        </li>`;
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => (
        {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    }

    // Featured
    const featured = cats.featured.map(n => byName[n]).filter(Boolean);
    document.getElementById("featured-grid").innerHTML =
      featured.map(repoCard).join("");

    // Groups
    const used = new Set([...cats.featured, ...cats.groups.flatMap(g => g.repos)]);
    const groupsHtml = cats.groups.map(g => {
      const list = g.repos.map(n => byName[n]).filter(Boolean);
      if (!list.length) return "";
      return `
        <section id="group-${g.slug}">
          <h3 class="group-title">${g.title}</h3>
          <ul class="repo-grid">${list.map(repoCard).join("")}</ul>
        </section>`;
    }).join("");
    document.getElementById("groups").innerHTML = groupsHtml;

    // Other
    const other = repos.filter(r => !used.has(r.name));
    document.getElementById("other-grid").innerHTML =
      other.map(repoCard).join("");
  }
  load().catch(e => console.error(e));
  </script>
</body>
</html>
